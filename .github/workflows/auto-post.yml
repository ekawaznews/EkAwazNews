name: Ek Awaz Auto-Publisher

on:
  schedule:
    - cron: '0 1 * * *'    # 06:00 PKT — batch A
    - cron: '0 7 * * *'    # 12:00 PKT — batch B
    - cron: '0 13 * * *'   # 18:00 PKT — batch C
  workflow_dispatch:
    inputs:
      batch:
        description: 'Batch to run (A, B, or C)'
        required: false
        default: 'A'

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Determine batch
        id: batch
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "BATCH=${{ github.event.inputs.batch }}" >> $GITHUB_ENV
          else
            HOUR=$(date -u +%H)
            if [ "$HOUR" -ge 0 ] && [ "$HOUR" -lt 5 ]; then
              echo "BATCH=A" >> $GITHUB_ENV
            elif [ "$HOUR" -ge 5 ] && [ "$HOUR" -lt 11 ]; then
              echo "BATCH=B" >> $GITHUB_ENV
            else
              echo "BATCH=C" >> $GITHUB_ENV
            fi
          fi

      - name: Run auto-publisher
        env:
          GEMINI_API_KEY:           ${{ secrets.GEMINI_API_KEY }}
          CLOUDINARY_CLOUD_NAME:    ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
        run: node autopost.js

      - name: Commit and push article pages
        run: |
          git config user.name "Ek Awaz Bot"
          git config user.email "bot@ekawaznews.github.io"
          git add news/
          git diff --cached --quiet || git commit -m "Auto-publish: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
