name: Ek Awaz Auto-Publisher

on:
  schedule:
    - cron: '0 1 * * *'    # 06:00 PKT — Batch A: Bulletin, Politics, Govt, Sports, Column
    - cron: '0 7 * * *'    # 12:00 PKT — Batch B: Bulletin, International, Entertainment, Economy, Editorial
    - cron: '0 13 * * *'   # 18:00 PKT — Batch C: Bulletin, National, Weather, Crime, Urdu
  workflow_dispatch:
    inputs:
      batch:
        description: 'Batch to run (A, B, or C)'
        required: false
        default: 'A'
        type: choice
        options: ['A', 'B', 'C']

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      # ── KEY FIX: Determine BATCH from which cron triggered ──
      # This is the reason all 3 runs were publishing the same batch before.
      # github.event.schedule matches the exact cron string that triggered this run.
      # workflow_dispatch uses the manually selected batch input.
      - name: Determine which batch to run
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BATCH="${{ github.event.inputs.batch }}"
          elif [ "${{ github.event.schedule }}" = "0 1 * * *" ]; then
            BATCH="A"
          elif [ "${{ github.event.schedule }}" = "0 7 * * *" ]; then
            BATCH="B"
          elif [ "${{ github.event.schedule }}" = "0 13 * * *" ]; then
            BATCH="C"
          else
            BATCH="A"
          fi
          echo "BATCH=$BATCH" >> $GITHUB_ENV
          echo "Running Batch: $BATCH"

      - name: Run auto-publisher
        env:
          GEMINI_API_KEY:            ${{ secrets.GEMINI_API_KEY }}
          CLOUDINARY_CLOUD_NAME:     ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET:  ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
          BATCH:                     ${{ env.BATCH }}
        run: node autopost.js

      - name: Commit and push article pages
        run: |
          git config user.name "Ek Awaz Bot"
          git config user.email "bot@ekawaznews.github.io"
          git add news/
          git diff --cached --quiet || git commit -m "Auto-publish Batch ${{ env.BATCH }}: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
