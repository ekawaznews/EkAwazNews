name: Ek Awaz Auto Publisher

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install packages
        run: npm install

      - name: Run Publisher
        env:
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
          NEWSAPI_KEY:       ${{ secrets.NEWSAPI_KEY }}
          GNEWS_KEY:         ${{ secrets.GNEWS_KEY }}
          WEATHERAPI_KEY:    ${{ secrets.WEATHERAPI_KEY }}
          CLOUDINARY_CLOUD:  ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
          WATERMARK_URL:     ${{ secrets.WATERMARK_URL }}
        run: node autopost.js

      - name: Commit and push article pages
        run: |
          git config user.name "Ek Awaz Bot"
          git config user.email "bot@ekawaznews.github.io"
          git add news/ || true
          git diff --cached --quiet || git commit -m "Auto-publish: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push || true
