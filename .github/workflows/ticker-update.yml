name: Ek Awaz Ticker Updater

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  ticker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: Update Ticker
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node update-ticker.js
