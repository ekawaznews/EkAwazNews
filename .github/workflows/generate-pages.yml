name: Ek Awaz Page Generator

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Inject SW cache version (auto-invalidate on every deploy)
        run: sed -i "s/BUILD_TIMESTAMP/$(date +%Y%m%d%H%M%S)/" sw.js

      - name: Run page generator
        run: node generate-pages.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Commit and push
        run: |
          git config user.name "Ek Awaz Bot"
          git config user.email "bot@ekawaznews.github.io"
          git add news/ sw.js
          git diff --cached --quiet || git commit -m "Page sync: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
